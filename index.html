<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikantné Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="falling-bg" id="fallingBg"></div>

    <div id="lock-screen" class="full-center">
        <div class="lock-card">
            <h2>🔑 Vstup do vášne</h2>
            <p>Zadajte prístupový kód:</p>
            <input type="password" id="pass-input" maxlength="3" placeholder="---">
            <button class="btn" onclick="checkPassword()">OTVORIŤ</button>
            <p id="error-msg" style="color:red;"></p>
        </div>
    </div>

    <div id="app-wrapper" style="display: none;">
        <div class="app-container">
            <div id="welcome-screen">
                <h1>🔥 Pikantné Menu 🔥</h1>
                <div id="carouselTrack"></div>
                <button class="welcome-btn" onclick="startRandomMode()">🎲 Náhodná poloha</button>
                <button class="welcome-btn" onclick="openTimerMenu()">⏱️ Sex-Timer</button>
                <button class="welcome-btn" onclick="startOnOnaGame()">🔥 Hra: On & Ona</button>
                <button class="welcome-btn" onclick="openBottleMenu()">🍾 3D Fľaša</button>
            </div>

            <div id="main-app" style="display: none;">
                <p id="instruction-text"></p>
                <button class="btn" onclick="goHome()">⬅️ Späť</button>
                
                <div id="roulette-display" style="display:none;"></div>
                <div id="bottle-scene-container" style="display:none;"></div>
                <div id="timer-section" style="display:none;"></div>
                <div id="on-ona-section" style="display:none;"></div>
                <div id="result-box" style="display:none;">
                    <h3 id="result-title"></h3>
                    <p id="res-desc"></p>
                    <img id="res-img" src="" alt="Pozícia">
                    <a id="res-pdf-link" href="#" target="_blank">📄 PDF</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
